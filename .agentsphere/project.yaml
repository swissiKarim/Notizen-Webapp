schemaVersion: 4
rationale: Single-file note app with ThreadingHTTPServer; ruff + pytest quality gates; API service for scenario verification
components:
  - name: app
    path: .
    toolchain:
      image: agentsphere/sandbox-polyglot
    verify:
      - ruff check .
      - pytest --tb=short -q --junitxml=.agentsphere/reports/junit.xml
    artifacts_ignore: []
definition_of_done:
  - ruff check . passes (exit 0)
  - pytest passes with at least one test
  - GET /health returns 200 on port 8099
network:
  needs: []
services:
  - name: web
    start: python app.py
    port: 8099
    health:
      http: /health
      timeoutSec: 30
    preview:
      path: /
